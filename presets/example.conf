# Example preset. One workspace per line:
#   label|agent count|prompt|working directory|model
# Prompt and model may be given per agent, separated by ';;'.
# Lines starting with '#' are comments. An optional line `# session: <name>`
# runs the preset in its own herdr session.
# No role files are assumed: agents get roles/_common.md only (reports go to conductor until projects sets `*=<name>`).
# A setup with roles (hr, watcher, sweeper, auditor ...) is in setup/examples/presets/roles.conf.
conductor|1|Follow conductor/README.md and report the current status in 5 lines.|~/work/example-repo
worker-a|1
worker-b|2||~/work/example-repo|sonnet;;haiku

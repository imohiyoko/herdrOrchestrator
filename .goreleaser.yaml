# herdrctl のリリース(ADR 0002)。.github/workflows/release.yml がタグ v* で動かす。
# 署名はまだしない(2026-11-19 の決定。macOS の公証・Windows のコード署名は後から足す)
version: 2
project_name: herdrctl
builds:
  - id: herdrctl
    main: ./cmd/herdrctl
    binary: herdrctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, windows, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/imohiyoko/herdrorchestrator/internal/version.Version={{.Version}}
      - -X github.com/imohiyoko/herdrorchestrator/internal/version.Commit={{.ShortCommit}}
      - -X github.com/imohiyoko/herdrorchestrator/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  filters:
    exclude: ["^docs", "^test"]
release:
  draft: false
  prerelease: auto

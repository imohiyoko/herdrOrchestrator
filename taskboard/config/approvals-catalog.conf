# 権限(操作)のカタログ。設定 policy(ADR 0007)に書ける「コマンドの中の操作」の候補と、その性質の定義(人が管理する設定)。
# policy は「誰が、どの操作を、何に対して allow / ask-any / ask-human / deny にするか」を決め、このファイルは「どんな操作があり、どれくらい危ないか」を説明する。
# このファイルは判定に使わない(決めるのは policy と既定の表 taskboard/perms/ops.tbl だけ)。Web UI の /perms と整合テストが読む。
# パターンは古い形(<操作名>:<対象>)。policy では <操作名> と <対象> の 2 つの欄に分けて書く(例: send:task:* → * send:task * = ...)。
# 場所は固定(環境変数で差し替えない)。書き換えるのは人だけ。
#
# 書式: 1 行 1 件、# から行末は注釈、空行可。フィールドは | で区切る(説明は最後で、| を含んでもよい)。
#   操作のパターン | 種別 | 副作用 | リスク階層 | allow の候補 | 状態 | 説明(1 行)
#
#   操作のパターン  tb approval check と同じ形の glob(* と ?)。使える文字は英数字と . _ : * ? -
#   種別            send / agent / alert / proxy / role / gate / setup / recipe / gh / git
#   副作用          none / local-write / external-send / external-write
#   リスク階層      low / mid / high / human-only(human-only は人だけが決める・実行する操作)
#   allow の候補    yes(広く allow にしてよい) / conditional(操作名に宛先・対象があり、それを絞った allow だけ) / no(allow にしない)
#                   操作名に宛先・対象が無い操作は conditional にできない(絞れないので yes か no)
#   状態            active(承認判定に渡す箇所がコードにある) / unwired(操作名はあるが承認判定には渡らない。policy の行は効かない) /
#                   reserved(将来用。まだ実装がない)
#
# 迷う項目は保守的(high か human-only)に置いている。tb の承認判定に渡す操作名を増やしたら、ここにも足す
# (taskboard/test/cases/82_catalog.sh が、コード中の操作名がこのカタログに載っているかを確かめる)。

# --- send: tb message send(送信)。ask なら outbox で人の承認待ち
send:task:*     | send  | local-write | high | conditional | active | 別の agent に作業を依頼する送信(tb message send --kind task)。受け取った agent が動き出すので、宛先を絞った allow だけにする
send:info:*     | send  | local-write | mid  | yes         | active | 別の agent への情報共有の送信(tb message send --kind info)。内容は指示として読まれうるが、既定の表(perms/ops.tbl)は運用上の割り切りで allow にしている
send:answer:*   | send  | local-write | mid  | yes         | active | 別の agent の質問への回答の送信(tb message send --kind answer)。既定の表(perms/ops.tbl)は allow にしている

# --- agent: agent の作成・停止・復活・圧縮。agent の pane から実行するときの承認(人の端末からは承認なし)
agent:new:*     | agent | local-write | high | conditional | active | agent を新しく起動する(tb agent-new)。プロセスと作業ディレクトリへの権限を持つ agent が増える
agent:stop:*    | agent | local-write | mid  | conditional | active | agent を止める(tb agent-stop)。tb agent-restart は stop と revive の両方が allow のときだけ通り、自分自身と指揮官は agent から再起動できない
agent:revive:*  | agent | local-write | mid  | conditional | active | 止めた agent を同じ会話から復活させる(tb agent-revive)
agent:spawn:*   | agent | local-write | high | conditional | active | 指揮官が子の agent を作る(tb agent-spawn)。数や役割は spawn の方針ファイルでも制限される
agent:compact:* | agent | local-write | mid  | conditional | active | 会話が長い agent に圧縮(/compact)を送る。scheduler の自動実行が使う
agent:model:*   | agent | local-write | mid  | conditional | active | agent のモデルを切り替える(tb model-set)。止めて同じ会話を --model 付きで復活させる。記録は op=revive(args.model_set=1)。--all は常に人の承認待ち
agent:slash:*   | agent | local-write | mid  | conditional | active | 許可リスト(config/slash.conf)にあるスラッシュコマンドを agent に送る(tb slash)。操作名は agent:slash:<コマンド>:<宛先>。--all は常に人の承認待ち

# --- agent:read: agent の中身(pane の出力)を読む(tb peek)。人と本人は承認なし
agent:read:*    | agent | none        | mid  | conditional | active | 他の agent の直近の出力を読む(tb peek)。会話の中身・秘密が見えうるので、読む相手を絞った allow(agent:read:@<役割> など)だけにする

# --- alert: アラートの解析
alert:analyze   | alert | local-write | mid  | yes         | active | アラート(外部の入力)が登録されたとき、解析役の agent を自動で起動する。既定の表(perms/ops.tbl)は allow にしている(同時に動かす数は別の上限がある)

# --- proxy: 代行依頼(agent が人に代わりの実行を頼む)。effect の名前だけあり、承認判定(approval_of)には渡らない
proxy:read-only | proxy | none        | low        | yes | unwired | 読み取りだけの代行。代行依頼は proxy_requests の別の仕組みで、この操作名は承認判定に渡らない(policy の proxy:* の行は効かない)
proxy:write     | proxy | local-write | high       | no  | unwired | ローカルのファイルや状態を書き換える代行。承認判定には渡らない(代行依頼の仕組みで人が判断する)
proxy:external  | proxy | external-write | human-only | no | unwired | 外部サービスへの書き込み・送信を伴う代行(公開、通知、課金など)。承認判定には渡らない(代行依頼の仕組みで人が判断する)

# --- role: 役割の変更
role:change     | role  | local-write | high | no          | active | 人事の agent が roles/ のファイルを書き換える。全 agent の振る舞いを変えられるので、広い allow にしない(操作名に対象が無く、絞れない)

# --- setup: セットアップ agent の書き込み(手順書に出てくるステップ)
setup:hooks     | setup | local-write | high       | no | active | hooks の設定ファイルへの書き込み(各 agent が実行するコマンドを決める)
setup:scheduler | setup | local-write | high       | no | active | 定期実行(scheduler)のジョブ設定の書き込み(定期的に実行されるコマンドを決める)
setup:webui     | setup | local-write | high       | no | active | Web UI まわりの設定の書き込み
setup:launchctl | setup | local-write | human-only | no | active | launchd への登録・解除(常駐するプロセスが変わる)

# --- gate: merge / approve を自動で通す口(将来用。いまは常に人が行い、実装も無効)
gate:merge      | gate  | external-write | human-only | no | reserved | PR の merge を、条件を満たしたときに自動で行う口(将来用)
gate:approve    | gate  | external-write | human-only | no | reserved | PR の approve を、条件を満たしたときに自動で行う口(将来用)
gate:execute    | gate  | external-write | human-only | no | reserved | gate の判定結果にもとづいて実行する口(将来用。いまは実行を常に無効にしている)

# --- recipe: 部品の並び(レシピ。ADR 0005)の実行。tb recipe-run の汎用の入口。操作名は recipe:<レシピ名>:<対象>(既定の対象は依頼者自身)
# レシピの許可は、中の部品の判定の代わりにならない(部品ごとに agent:stop:<対象> などを別に判定する)。人だけの部品は、許可しても agent からは実行できない。
# レシピごとのリスク階層は中の部品の最大で、tb recipe-list / recipe-show が出す。ここでは最も高い場合に合わせて high にしている
recipe:*:*      | recipe | local-write | high | conditional | active | 登録したレシピを実行する(tb recipe-run)。登録されていないレシピ名は ask ではなく実行しない。grants では recipe:<名前> <対象> と書く

# --- gh: tb gh(GitHub の PR のコメント・レビュー)。操作名は gh:<操作>:<owner/repo>。GitHub へ出るコマンドは config/github.conf(taskboard/docs/gh.md)
gh:read:*       | gh     | none           | low  | yes         | active | PR のコメント・レビューを読む(tb gh comment list / review list)。本文は第三者が書いたデータ
gh:comment:*    | gh     | external-write | mid  | conditional | active | PR にコメントを書く(tb gh comment add)。リポジトリを絞った allow だけにする
gh:review:*     | gh     | external-write | mid  | conditional | active | PR にコメントだけ・変更依頼のレビューを出す(tb gh review add)
gh:approve:*    | gh     | external-write | high | conditional | active | PR を approve する(tb gh review approve)。マージの条件に数えられるので、既定の表は deny。リポジトリと主体を絞って渡す
gh:merge:*      | gh     | external-write | high | conditional | active | PR をマージする(tb gh pr merge)。取り消せない。既定の表は deny。渡すならリポジトリと主体を絞り、--head で先頭のコミットを固定する

# --- gh のそのまま渡すコマンド(tb gh <gh のコマンド>)。操作名は gh:<コマンド>-<サブコマンド>:<owner/repo>
gh:auth-*:*     | gh     | external-write | human-only | no | active | gh の認証を見る・変える(tb gh auth ...)。gh auth token で token を出せるので、agent には渡さない
gh:secret-*:*   | gh     | external-write | human-only | no | active | Actions などの秘密を変える(tb gh secret ...)
gh:variable-*:* | gh     | external-write | high | no | active | Actions などの変数を変える(tb gh variable ...)
gh:config-*:*   | gh     | local-write | high | no | active | gh の設定を変える(tb gh config ...)
gh:extension-*:*| gh     | local-write | human-only | no | active | gh の拡張を入れる・動かす(tb gh extension ...)。任意のコードを動かせる
gh:alias-*:*    | gh     | local-write | high | no | active | gh の別名を変える(tb gh alias ...)。別名で別のコマンドを動かせる
gh:ssh-key-*:*  | gh     | external-write | human-only | no | active | アカウントの SSH 鍵を変える(tb gh ssh-key ...)
gh:gpg-key-*:*  | gh     | external-write | human-only | no | active | アカウントの GPG 鍵を変える(tb gh gpg-key ...)
gh:repo-delete:*| gh     | external-write | human-only | no | active | リポジトリを消す(tb gh repo delete)。取り消せない
gh:api:*        | gh     | external-write | high | conditional | active | 任意の GitHub API を呼ぶ(tb gh api)。approve・マージ・設定の変更もできるので、既定の表は deny。渡すならリポジトリと主体を絞る
gh:*-list:*     | gh     | none | low | yes | active | 一覧を読む(tb gh issue list / run list など)
gh:*-view:*     | gh     | none | low | yes | active | 1 件を読む(tb gh issue view / pr view など)
gh:*-status:*   | gh     | none | low | yes | active | 状態を読む(tb gh pr status など)
gh:*-diff:*     | gh     | none | low | yes | active | 差分を読む(tb gh pr diff)
gh:*-checks:*   | gh     | none | low | yes | active | CI の結果を読む(tb gh pr checks)
gh:*-watch:*    | gh     | none | low | yes | active | 実行中のものを見る(tb gh run watch など)
gh:search-*:*   | gh     | none | low | yes | active | 検索する(tb gh search ...)
gh:status:*     | gh     | none | low | yes | active | 自分に関わる PR・issue の一覧(tb gh status)

# --- git: tb git(GitHub のリモートへの git の操作)。操作名は git:<サブコマンド>:<owner/repo>
git:fetch:*     | git    | local-write | low | yes | active | GitHub のリモートから取る(tb git fetch)
git:pull:*      | git    | local-write | low | yes | active | GitHub のリモートから取って合わせる(tb git pull)
git:ls-remote:* | git    | none | low | yes | active | リモートの参照を読む(tb git ls-remote)
git:clone:*     | git    | local-write | low | yes | active | clone する(tb git clone)
git:push:*      | git    | external-write | mid | conditional | active | push する(tb git push)。既定の表は ask
git:push-force:*| git    | external-write | high | conditional | active | force・削除・+refspec・--mirror・--prune を含む push(tb git push)。取り消しにくいので既定の表は deny

name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # 流す組は tests/affected.sh が変えたファイルから決める(PR だけ。main への push と手で流すときは全部)。
  # 決め方・全部に倒れる条件は tests/affected.sh の頭。組を足しても、ここは書き換えない。
  # tb・scheduler の中身は herdrctl なので、どの組も下で herdrctl を作って PATH に置いてから流す
  plan:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2    # PR はマージ後のコミット。1 つ目の親(main)との差が PR の変更
          persist-credentials: false
      - uses: actions/setup-go@v5    # affected.sh が go list で Go のパッケージの依存を見る
        with:
          go-version-file: go.mod
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: bash tests/affected.sh --ci "$EVENT"
  test:
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    name: test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq
      # tb・scheduler の中身(herdrctl)。taskboard・scheduler の組と、tb を呼ぶテスト(misc の tests/test_instance.sh など)のために PATH に置く
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p "$RUNNER_TEMP/bin" && go build -o "$RUNNER_TEMP/bin/herdrctl" ./cmd/herdrctl && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash tests/run-all.sh "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
  # ブランチ保護で必須にする 1 つのチェック(matrix の名前が変わっても、これだけ見ればよい)。
  # 流す組が無くて test を飛ばしたときも通す(plan が通っていることは確かめる)
  test-all:
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.plan.result }}" = success ] && case "${{ needs.test.result }}" in success|skipped) ;; *) false;; esac'

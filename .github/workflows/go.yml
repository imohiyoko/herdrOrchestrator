name: go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # herdrctl(ADR 0002)を 3 つの OS の上でテストする。Windows でも毎回動くことを確かめる
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: go test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu だけ、sqlite3 と jq を使うテストも流す
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 jq
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/herdrctl version
  # 配布する 6 つ(darwin・windows・linux × amd64・arm64)が全部ビルドできるか。リリースと同じ設定で、公開はしない
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
  # tb のテスト: taskboard のテストを herdrctl を作って流す(tb の中身は herdrctl)。組は taskboard/test/run.sh --list-shards(weights の秒数で自動で分ける)
  tb-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        run: echo "shards=$(bash taskboard/test/run.sh --list-shards | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
  tb-go:
    needs: tb-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.tb-shards.outputs.shards) }}
    name: tb (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq
      - run: go build -o "$RUNNER_TEMP/herdrctl" ./cmd/herdrctl
      - run: TB_HERDRCTL="$RUNNER_TEMP/herdrctl" bash taskboard/test/run.sh --shard "${{ matrix.shard }}"
  # 契約テスト: scheduler のテストを SCHED_IMPL=go で流す(show.sh は herdrctl sched show が答える)
  sched-go:
    runs-on: ubuntu-latest
    name: scheduler contract (SCHED_IMPL=go)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq
      - run: go build -o "$RUNNER_TEMP/herdrctl" ./cmd/herdrctl
      - run: SCHED_IMPL=go SCHED_HERDRCTL="$RUNNER_TEMP/herdrctl" TB_HERDRCTL="$RUNNER_TEMP/herdrctl" bash scheduler/tests/run.sh   # scheduler のテストは tb も呼ぶ
  # ブランチ保護で必須にする 1 つのチェック
  go-all:
    if: always()
    needs: [test, snapshot, tb-go, sched-go]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test.result }}" = success ] && [ "${{ needs.snapshot.result }}" = success ] && [ "${{ needs.tb-go.result }}" = success ] && [ "${{ needs.sched-go.result }}" = success ]'

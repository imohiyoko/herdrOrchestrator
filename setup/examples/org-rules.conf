# 組織図(setup/examples/org.conf)を使う権限の利用例。grants と delivery の行の例で、そのまま 1 つのファイルとしては入れない。
# 使う行を選んで tb config edit grants / tb config edit delivery に足す(書く前に差分を見せる)。判定は tb can で確かめる。
#
# --- grants(許可を足すだけ。delivery の block や protect は外さない)
# 指揮役は配下の中身を読め、直属の部下には依頼を送れる
@conductor agent:read ~subordinate
@conductor send:task  ~report
# 指揮役は配下の判定フラグを付けられる(止めるのは人か、approvals の agent:stop)
@conductor agent:flag ~subordinate
# worker は自分の上司へ info(進捗の知らせ)を承認なしで送れる
@worker    send:info  ~manager
#
# --- delivery(上から見て最初に当たった行で届ける / 保留 / 止める)
# worker は自分の上司へは届く。ほかの worker へは止める(依頼はチケットにする)
# @worker    -> ~manager : *=now
# @worker    -> @worker  : *=block reply=now
# 指揮役から直属の部下へは届ける
# @conductor -> ~report  : *=now

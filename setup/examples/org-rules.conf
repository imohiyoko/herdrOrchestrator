# 組織図(setup/examples/org.conf)を使う権限の利用例。policy と delivery の行の例で、そのまま 1 つのファイルとしては入れない。
# 使う行を選んで tb config edit policy / tb config edit delivery に足す(書く前に差分を見せる)。判定は tb can で確かめる。
#
# --- policy(<主体> <操作> <対象> = <効果>。当たる行のうちいちばん厳しい効果。delivery の block や protect は外さない)
# 指揮役は配下の中身を読め、直属の部下には依頼を送れる
@conductor agent:read ~subordinate = allow
@conductor send:task  ~report      = allow
# 指揮役は配下の判定フラグを付けられる(止めるのは人か、policy の agent:stop が allow の agent)
@conductor agent:flag ~subordinate = allow
# worker は自分の上司へ info(進捗の知らせ)を承認なしで送れる
@worker    send:info  ~manager     = allow
# 指揮役は直属の部下が ask で止めた依頼の送信を承認できる(tb approval approve O-<n>。自分の依頼・--always は人だけ)
@conductor approve:send:task:* ~report = allow
#
# --- delivery(上から見て最初に当たった行で届ける / 保留 / 止める)
# worker は自分の上司へは届く。ほかの worker へは止める(依頼はチケットにする)
# @worker    -> ~manager : *=now
# @worker    -> @worker  : *=block reply=now
# 指揮役から直属の部下へは届ける
# @conductor -> ~report  : *=now

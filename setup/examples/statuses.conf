# チケットの状態の例(確認を 2 段に分け、名前を日本語にする)。tb config set statuses --shared < setup/examples/statuses.conf で入れる。
# 書式と分類の意味は taskboard/config/statuses.conf.example。tb のコマンドは分類で動くので、名前は自由に変えてよい。
# 組み込みの名前(todo / in_progress など)は書かなくても、アラート・提案のチケットはそのまま動く。
未着手       todo      = まだ誰も手を付けていない(tb claim できる)
作業中       active    = 担当が進めている(tb nudge の催促の対象)
レビュー待ち review    = PR を出して人のレビューを待っている
検証待ち     review    = マージ後の動作確認を待っている
詰まり       blocked   = 進められない(tb block)
完了         done      = 終わった(tb done。tb report で届く)
取り消し     cancelled = やらないと決めた(tb cancel)

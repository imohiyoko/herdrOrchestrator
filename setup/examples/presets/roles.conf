# Example preset for the role setup in setup/examples/roles (install the roles first, see setup/CLAUDE.md).
# Copy to presets/<name>.conf to use it. One workspace per line:
#   label|agent count|prompt|working directory|model
# Prompt and model may be given per agent, separated by ';;'.
# Lines starting with '#' are comments. An optional line `# session: <name>`
# runs the preset in its own herdr session.
conductor|1|Follow conductor/README.md and report the current status in 5 lines.|~/work/example-repo
hr|1|Read your role with tb role-show. Run tb roles and report which agents have outdated roles.|~/work/herdrOrchestrator
watch|1|Read your role with tb role-show.|~/work/example-repo|haiku
sweeper|1|Read your role with tb role-show and wait for the scheduled prompt.|~/work/herdrOrchestrator|haiku
auditor|1|Read your role with tb role-show and wait for the scheduled review prompt.|~/work/herdrOrchestrator|sonnet
worker-a|1
worker-b|2||~/work/example-repo|sonnet;;haiku

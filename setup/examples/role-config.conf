# 役割を使う構成で、役割ごとに入れる設定の利用例(setup/CLAUDE.md の「2b. 役割の利用例」)。
# tb のコードは役割の名前を知らない。指揮役・人事役・判定役が何をできるかは、ここにある projects と policy の行だけで決まる。
# そのまま 1 つのファイルとしては入れない。使う役割の行を選び、名前を実際の agent 名・役割名に直して
# tb config edit projects / tb config edit policy に足す(書く前に差分を見せる)。判定は tb can <主体> <操作> <対象> で確かめる。
#
# --- 指揮役(conductor): 報告と既定の宛先
# projects(<project>=<名前>。* は既定の宛先)。ここに書いた名前が「指揮官」として扱われる:
#   宛先なしの送信・worker の報告(tb comment / tb done)・tb digest のまとめ・アラートの結果の届け先になり、
#   既定の delivery(行が無いとき)で送れるのはこの名前だけ。tb slash・tb model-set・tb agent shed・tb compact の対象から外れ、
#   agent からは再起動できない(人が実行する)。* の行が無いと宛先が決まらず、報告は送られずに pending に残る。
#   [projects]
#   *=conductor
#   project-a=project-a-conductor
#
# --- 人事役(hr): ロールの付け替えと改善提案の受け手
# 役割を変えられる agent は policy の role:change の行で決まる(行が無ければ人の承認待ち)。
# 自分の持つ役割を配る・書き換えるのは、行があっても人だけ。
#   [policy]
#   @hr role:change * = allow
# 改善提案(tb proposal)の宛先・担当。無ければ projects の * の行の名前。
#   [projects]
#   proposal=hr
#
# --- 判定役(sweeper): 止めてよいかの印(tb agent-flag / agent-new --killable)
# 行が無ければ印を付けられるのは人だけ。
#   [policy]
#   @sweeper agent:flag * = allow
#
# --- 会計役(auditor)・見張り(watcher)・解析(analyst)・下書き(drafter)・worker
# 特別な権限は要らない。定期実行のジョブ(scheduler/jobs/*.conf.example)と、必要なら org-rules.conf の行を使う。

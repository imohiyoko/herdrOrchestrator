# 組織図の利用例(setup/examples/roles の役割に合わせたもの)。書式は taskboard/config/org.conf.example。
# 入れ方: 承認後に bash taskboard/bin/tb config set org --shared < setup/examples/org.conf
# 指揮役の agent 名は setup/examples/presets/roles.conf と同じ conductor。違う名前なら書き換える。上から見て最初に当たった行で上司が決まる。
#
# 子 agent(tb agent-spawn)は立てた親の部下
@worker     -> ~parent
# worker と解析役・下書き役は指揮役の部下
@worker     -> conductor
@analyst    -> conductor
@drafter    -> conductor
# 人事・見張り・判定・会計は指揮役の直属
@hr         -> conductor
@watcher    -> conductor
@sweeper    -> conductor
@auditor    -> conductor
